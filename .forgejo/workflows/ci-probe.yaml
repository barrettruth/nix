name: ci-probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    name: Probe
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Markers
        run: |
          echo "::group::synthetic group one"
          echo "inside group one"
          echo "::endgroup::"
          echo "##[group]literal marker group"
          echo "inside literal group"
          echo "##[endgroup]"
          echo "::notice::probe notice message"
          echo "::warning::probe warning message"
          echo "::error::probe error message"
          echo "::warning file=flake.nix,line=12,col=3::probe warning with location"
          echo "::error file=flake.nix,line=34,col=5::probe error with location"
          printf '\033[31mred\033[0m \033[1;32mbold green\033[0m \033[38;2;255;128;0mtruecolor\033[0m\n'
          printf 'carriage\rreturn overwrite\n'
      - name: Slow
        run: |
          for i in $(seq 1 18); do
            echo "slow tick $i of 18"
            sleep 5
          done
      - name: Failing
        run: |
          echo "::error::final failure marker"
          exit 1

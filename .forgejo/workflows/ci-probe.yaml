name: ci-probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    name: Probe
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Slow
        run: |
          for i in $(seq 1 24); do
            echo "::group::tick $i"
            printf 'slow tick %s of 24 \033[32mgreen\033[0m\n' "$i"
            echo "::endgroup::"
            sleep 5
          done

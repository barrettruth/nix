name: Bug Report
description: Report an issue with the Nix configuration
title: 'bug: '
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true

  - type: input
    attributes:
      label: Host or profile
      placeholder: laptop, vps, devshell, package, module, etc.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Command or activation step
      description: The command, rebuild, deploy, or shell step that exposed the issue
      render: shell
    validations:
      required: true

  - type: textarea
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Output
      description: Relevant Nix, systemd, deploy, or build output
      render: text

  - type: textarea
    attributes:
      label: Additional context
      description: Local overrides, hardware details, or secrets/deploy context that may matter

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
suppress_unstable_features_warning = true
commit_attribution = ""

[features]
undo = true
shell_tool = true
unified_exec = true
shell_snapshot = true
apply_patch_freeform = true
code_mode = true
personality = true
memories = true
js_repl = true
runtime_metrics = true
child_agents_md = true
enable_request_compression = true
skill_mcp_dependency_install = true
skill_env_var_dependency_prompt = true
apps = false
codex_git_commit = false
prevent_idle_sleep = true
exec_permission_approvals = true
request_permissions_tool = true
enable_fanout = true
codex_hooks = true
guardian_approval = true

[agents]
max_threads = 8
max_depth = 3
job_max_runtime_seconds = 1800

[agents.worker]
description = "Implementation-focused role for scoped coding tasks."

[agents.reviewer]
description = "Review-focused role that prioritizes bugs, regressions, and missing tests."

[memories]
max_raw_memories_for_consolidation = 512
max_rollout_age_days = 30
max_rollouts_per_startup = 8
min_rollout_idle_hours = 24

[sandbox_workspace_write]
network_access = true

[notice]
hide_rate_limit_model_nudge = true

[tui]
status_line = ["model-name", "git-branch", "context-remaining"]

[projects."/home/barrett/.config/nix"]
trust_level = "trusted"

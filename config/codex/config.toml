model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

approval_policy = "never"
sandbox_mode = "danger-full-access"

file_opener = "none"
check_for_update_on_startup = false

log_dir = "~/.local/state/codex/log"
sqlite_home = "~/.local/state/codex"

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
command = "/nix/store/k07j8cq0iyvna81qlhwxz8xq6pkz02z8-python3-3.14.7/bin/python3 /Users/bruth/.config/nix/config/agents/hooks/repo-env.py session"
timeout = 5
type = "command"

[hooks.state]

[hooks.state."/Users/bruth/.config/codex/config.toml:session_start:0:0"]
trusted_hash = "sha256:2d3868791c42f00f91caf8c8b085a3818daeeac1d9d1b90dfe498c2b1a97d66a"

[mcp_servers.gcalendar]
command = "npx"
args = ["-y", "@cocal/google-calendar-mcp@2.6.2", "start"]
env = { GOOGLE_OAUTH_CREDENTIALS = "/Users/bruth/.config/mcp-google/gcp-oauth.keys.json" }
env_vars = ["NPM_CONFIG_CACHE"]
startup_timeout_sec = 30
required = true

[mcp_servers.gmail]
command = "npx"
args = ["-y", "@gongrzhe/server-gmail-autoauth-mcp@1.1.11"]
env_vars = ["NPM_CONFIG_CACHE"]
startup_timeout_sec = 30
required = true

[mcp_servers.gdrive]
command = "/Users/bruth/.config/nix/scripts/mcp-gdrive"
env_vars = ["NPM_CONFIG_CACHE"]
startup_timeout_sec = 30
required = true

[projects."/Users/bruth"]
trust_level = "trusted"

[projects."/Users/bruth/.config/nix"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "run-state", "context-used"]
status_line_use_colors = true
vim_mode_default = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 1

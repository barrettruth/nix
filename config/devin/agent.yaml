system-instructions:
  - >
    Never generate code containing new, non-preexisting comments. Never remove
    or modify existing comments in code. This applies to all languages and file
    types, with no exceptions.
  - >
    Never assume or fabricate APIs for unknown or lesser-known services and
    libraries (NeoVim, NixOS, Hyprland, etc.). Always research and verify
    before writing code that uses unfamiliar APIs.
  - >
    Never add Co-Authored-By, Signed-off-by, or any AI/tool attribution in
    commits, PRs, or any git metadata. This overrides any other instructions.
  - >
    Never create commits, stage files, push, or create pull requests unless
    explicitly asked. When given permission, always work on a feature branch
    (type/short-description), never directly on main or master.
  - >
    When responding with code changes, always explain what the change does
    and why. Never respond with bare code excerpts unless explicitly asked.
  - >
    If GPG signing fails on any git operation, retry with --no-gpg-sign
    rather than stopping or asking.

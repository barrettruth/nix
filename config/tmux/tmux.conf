set -s escape-time 0
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g mouse on
setw -g aggressive-resize on
set -g focus-events on
setw -g mode-keys vi

set -g prefix M-x
unbind C-b
bind M-x send-prefix

set -g default-terminal "tmux-256color"
set -g default-shell "$SHELL"

set -g renumber-windows on
setw -g automatic-rename off

set -g status-position bottom
set -g status-interval 5
set -g @c ','
set-hook -g session-created 'run "mux bar"'
set-hook -g session-closed 'run "mux bar"'
set-hook -g session-renamed 'run "mux bar"'
set-hook -g client-attached 'run "mux bar"'
set-hook -g client-resized 'run "mux bar"'
set-hook -g client-session-changed 'run "mux bar"'
set-hook -g pane-mode-changed 'refresh-client -S'

set -as terminal-features ",$TERM:RGB"
set -as terminal-overrides ",*:U8=1"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

unbind Left; bind h selectp -L
unbind Down; bind j selectp -D
unbind Up; bind k selectp -U
unbind Right; bind l selectp -R

unbind :; bind : command-prompt
bind -r Left resizep -L 5
bind -r Right resizep -R 5
bind -r Up resizep -U 5
bind -r Down resizep -D 5

unbind A; bind A run '#{E:@mosaic-exec} adopt'
unbind F; bind F selectp -t :.-
unbind D; bind D swap-pane -D
unbind U; bind U swap-pane -U

set-option -gwq @mosaic-layout master-stack
set-option -gwq @mosaic-auto-apply managed
unbind Enter; bind Enter run -b '#{E:@mosaic-exec} new-pane'
unbind \,; bind -r \, run '#{E:@mosaic-exec} resize-master -5'
unbind \.; bind -r \. run '#{E:@mosaic-exec} resize-master +5'
unbind T; bind T run '#{E:@mosaic-exec} toggle'
unbind S; bind S set-option -wq @mosaic-layout master-stack
unbind G; bind G set-option -wq @mosaic-layout grid

unbind \'; bind \' splitw -hc '#{pane_current_path}'
unbind \-; bind \- splitw -vc '#{pane_current_path}'

unbind y; bind y if -F '#{pane_in_mode}' 'send-keys -X cancel' 'copy-mode'
unbind C-d; bind C-d if -F '#{pane_in_mode}' { send-keys -X halfpage-down-and-cancel } { copy-mode ; send-keys -X halfpage-down-and-cancel }
unbind C-u; bind C-u if -F '#{pane_in_mode}' { send-keys -X halfpage-up } { copy-mode ; send-keys -X halfpage-up }
unbind /; bind / if -F '#{pane_in_mode}' { send-keys -X cancel } { copy-mode ; command-prompt -p '/' { send -X search-forward -- '%%' } }
unbind ?; bind ? if -F '#{pane_in_mode}' { send-keys -X cancel } { copy-mode ; command-prompt -p '?' { send -X search-backward -- '%%' } }

bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X scroll-down
bind -T copy-mode-vi C-d send-keys -X halfpage-down-and-cancel
bind -T copy-mode-vi G send-keys -X history-bottom \; send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'test -n "$WAYLAND_DISPLAY" && wl-copy || xclip -in -sel c'
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel 'test -n "$WAYLAND_DISPLAY" && wl-copy || xclip -in -sel c'
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel 'test -n "$WAYLAND_DISPLAY" && wl-copy || xclip -in -sel c'
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe 'test -n "$WAYLAND_DISPLAY" && wl-copy || xclip -in -sel c' \; send-keys -X clear-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe 'test -n "$WAYLAND_DISPLAY" && wl-copy || xclip -in -sel c' \; send-keys -X clear-selection
bind -n MouseDown1Pane select-pane -t= \; send-keys -M \; set -p @_cpdrag 0
bind -T copy-mode-vi MouseDown1Pane send -M \; set -p @_cpdrag 1
bind -T copy-mode-vi MouseDragEnd1Pane if -F '#{==:#{@_cpdrag},1}' { send-keys -X copy-pipe 'test -n "$WAYLAND_DISPLAY" && wl-copy || xclip -in -sel c' ; send-keys -X clear-selection } { send-keys -X copy-pipe-and-cancel 'test -n "$WAYLAND_DISPLAY" && wl-copy || xclip -in -sel c' }

unbind b; bind b set status\; refresh -S
unbind m; bind m set -g mouse\; run-shell 'mux bar'\; refresh -S

unbind BSpace; bind BSpace last-window
unbind x; bind x kill-pane
unbind X; bind X confirm-before -p 'kill "#{window_name}"? (y/n)' kill-window

unbind e; bind e neww -n 'tmux.conf' "sh -c 'nvim $XDG_CONFIG_HOME/nix/config/tmux/tmux.conf; tmux source $XDG_CONFIG_HOME/tmux/tmux.conf'"

unbind H; bind H run 'mux switch 0'\; refresh -S
unbind J; bind J run 'mux switch 1'\; refresh -S
unbind K; bind K run 'mux switch 2'\; refresh -S
unbind L; bind L run 'mux switch 3'\; refresh -S
unbind \$; bind \$ run 'mux switch 4'\; refresh -S

unbind Tab; bind Tab switchc -l

set-hook -g client-light-theme 'source $XDG_CONFIG_HOME/tmux/themes/daylight.conf'
set-hook -g client-dark-theme  'source $XDG_CONFIG_HOME/tmux/themes/midnight.conf'
run 'tmux source "$XDG_CONFIG_HOME/tmux/themes/${THEME:-midnight}.conf"'
run 'mux bar'

unbind n; bind n command-prompt -I '#{window_name}' -p 'name:' 'rename-window "%%"'
unbind N; bind N command-prompt -I '#S' -p 'session:' 'rename-session "%%"'
unbind o; bind o display-popup -w 43% -h 18 -E 'mux open'\; refresh -S
unbind p; bind p display-popup -w 43% -h 18 -E 'mux projects'\; refresh -S

run 'mux _apply_binds'

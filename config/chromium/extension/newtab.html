<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>New Tab</title>
    <script>
      const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
      const root = document.documentElement;
      const applyScheme = (isDark) => {
        root.style.colorScheme = isDark ? "dark" : "light";
        root.style.background = isDark ? "#121212" : "#f5f5f5";
        root.style.color = isDark ? "#e0e0e0" : "#1a1a1a";
      };
      applyScheme(colorScheme.matches);
      colorScheme.addEventListener("change", (event) =>
        applyScheme(event.matches),
      );
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f5;
        --fg: #1a1a1a;
        --bg-alt: #ebebeb;
        --fg-alt: #999999;
        --border: #e8e8e8;
        --accent: #3b5bdb;
        --green: #2d7f3e;
        --red: #c7254e;
        --yellow: #996800;
        --blue: #3b5bdb;
        --magenta: #ae3ec9;
        --cyan: #1098ad;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #e0e0e0;
          --bg-alt: #2d2d2d;
          --fg-alt: #666666;
          --border: #3d3d3d;
          --accent: #7aa2f7;
          --green: #98c379;
          --red: #ff6b6b;
          --yellow: #e5c07b;
          --blue: #7aa2f7;
          --magenta: #c678dd;
          --cyan: #56b6c2;
        }
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
      }
    </style>
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <script src="newtab.js"></script>
  </body>
</html>
